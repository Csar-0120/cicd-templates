name: Build and Push (reusable)

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC claims (temporal - borrar después)
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          echo $TOKEN | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: '89ab25fd-00a2-410d-8eb3-6b77056a9d53'
          tenant-id: 'aa2c3abd-6fe7-4c99-9766-957e2535daef'
          subscription-id: '229d4480-6530-45dc-979a-8b927a7bd2cd'

      - name: Azure CLI script
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az account show
